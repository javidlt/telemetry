name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: setup-project

jobs:
  build-and-test:
    name: Build + Unit Tests (with coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: telemetry-dist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: setup-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run coverage

      - name: Upload coverage report (UAT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: setup-project/coverage
          retention-days: 30

      - name: Upload build artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-dist
          path: setup-project/dist
          retention-days: 30

  deploy-prod:
    name: Deploy to Cloudflare (Prod)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: setup-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: telemetry-dist
          path: setup-project/dist

      - name: Deploy to Cloudflare Workers (prod env — telemetry-prod)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: setup-project
          command: deploy --name telemetry-prod
